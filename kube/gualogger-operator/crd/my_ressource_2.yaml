apiVersion: doteich.com/v1alpha
kind: GuaLogger
metadata:
  name: my-gualogger-2
spec:
  logger:
    connection:
      endpoint: 192.168.178.108
      port: 49320
      mode: SignAndEncrypt
      policy: Basic256Sha256
      authentication:
        type: None
      certificate:
        auto_create: true
      retry_count: 10
    subscription:
      sub_interval: 1
      nodeids:
        - id: "ns=2;s=Machines.Packaging.Tag 1"
          meta:
            - key: name
              value: "Tag 1"
            - key: mqtt_topic
              value: "gualogger/tag1"
        - id: "ns=2;s=Machines.Packaging.Tag 2"
    exporters:
      timescale-db:
        host: localhost
        port: 5432
        username: postgres
        password: postgres
        database: postgres
        table: gualogger
      mqtt:
        protocol: mqtt
        protocol_version: 4
        host: localhost
        port: 1883
        username: admin
        password: admin
        topic: gualogger
        client_id: gualogger
        qos: 0
        retain: false
        topic_by_nodeid: true
  kube:
    namespace: gualogger
    name: my-gualogger
